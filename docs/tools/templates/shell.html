<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceylon Stack Documentation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..900;1,300..900&family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --sapphire:#21407A; --sapphire-tint:#E7ECF6; --sapphire-strong:#16264A;
    --cinnamon:#A85C31; --cinnamon-tint:#F3E4D8;
    --tea:#3D7A56; --tea-tint:#E1EEE5;
    --turmeric:#B87A1E; --turmeric-tint:#F6E9D2;
    --terracotta:#AD4034; --terracotta-tint:#F5E1DE;
    --bg:#F2F4F9; --surface:#FFFFFF; --surface-alt:#E9EDF4; --border:#D6DDE8;
    --ink:#181E2B; --ink-soft:#525C70; --ink-faint:#7C8598;
    --accent:#21407A; --code-bg:#0F1420;
    --shadow: 0 1px 2px rgba(20,28,50,.06), 0 8px 24px rgba(20,28,50,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10131A; --surface:#161A23; --surface-alt:#1D2230; --border:#2A3142;
      --ink:#E9EDF6; --ink-soft:#A6B0C4; --ink-faint:#78829A;
      --accent:#6E93D8; --sapphire:#6E93D8; --sapphire-tint:#1C2A47;
      --cinnamon:#D89566; --cinnamon-tint:#3A2A1E;
      --tea:#6FBE90; --tea-tint:#1C3226;
      --turmeric:#E3AA52; --turmeric-tint:#3A2E18;
      --terracotta:#E17A6B; --terracotta-tint:#3B2320;
      --code-bg:#0A0D14;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10131A; --surface:#161A23; --surface-alt:#1D2230; --border:#2A3142;
    --ink:#E9EDF6; --ink-soft:#A6B0C4; --ink-faint:#78829A;
    --accent:#6E93D8; --sapphire:#6E93D8; --sapphire-tint:#1C2A47;
    --cinnamon:#D89566; --cinnamon-tint:#3A2A1E;
    --tea:#6FBE90; --tea-tint:#1C3226;
    --turmeric:#E3AA52; --turmeric-tint:#3A2E18;
    --terracotta:#E17A6B; --terracotta-tint:#3B2320;
    --code-bg:#0A0D14;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; color-scheme:light dark;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",ui-sans-serif,sans-serif; font-size:15.5px; line-height:1.6;}
  h1,h2,h3,h4{font-family:"Archivo",sans-serif; text-wrap:balance; margin:0 0 8px;}
  p{margin:0 0 14px; max-width:70ch; color:var(--ink-soft);}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  a{color:var(--accent);}
  ul,ol{margin:0 0 14px; padding-left:1.2em;}
  li{margin-bottom:6px; color:var(--ink-soft);}
  table{border-collapse:collapse; width:100%; font-size:.9rem; margin-bottom:16px;}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  th{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:500;}

  /* ---- shell / topbar ---- */
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
    padding:12px 18px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .topbar .brand{display:flex; align-items:center; gap:10px; font-family:"Fraunces",serif; font-weight:600; font-size:1.15rem;}
  .topbar .tag{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-faint); letter-spacing:.05em;}
  .menu-btn{display:none; border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:7px 10px; font-family:"IBM Plex Sans",sans-serif; font-size:13px; color:var(--ink); cursor:pointer;}

  .mode-tabs{display:flex; gap:4px; margin-left:18px; flex-wrap:wrap;}
  .mode-tab{border:1px solid var(--border); background:var(--surface-alt); color:var(--ink-soft); font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; padding:6px 11px; border-radius:8px; cursor:pointer;}
  .mode-tab:hover{color:var(--ink);}
  .mode-tab.active{background:var(--sapphire); color:#fff; border-color:var(--sapphire);}

  .search-box{margin-left:auto; position:relative;}
  .search-box input{background:var(--surface-alt); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:13px; color:var(--ink); width:190px; font-family:"IBM Plex Sans",sans-serif;}
  .search-box input:focus{outline:2px solid var(--sapphire); outline-offset:1px;}
  .search-results{position:absolute; top:38px; right:0; width:360px; max-height:60vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); z-index:40; display:none;}
  .search-results.open{display:block;}
  .search-results a{display:block; padding:10px 14px; border-bottom:1px solid var(--border); color:var(--ink); text-decoration:none;}
  .search-results a:last-child{border-bottom:none;}
  .search-results a:hover{background:var(--surface-alt);}
  .search-results a b{font-weight:600;}
  .search-results a small{display:block; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:10px; text-transform:uppercase; letter-spacing:.04em; margin-top:3px;}
  .search-empty{padding:14px; color:var(--ink-faint); font-size:13px;}

  .shell{display:flex; align-items:flex-start; max-width:1320px; margin:0 auto;}
  .sidebar{
    width:272px; flex:none; position:sticky; top:57px; align-self:flex-start;
    max-height:calc(100vh - 57px); overflow-y:auto; padding:22px 14px 60px;
    border-right:1px solid var(--border);
  }
  .sidebar .grp{margin-bottom:20px;}
  .sidebar .grp-title{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); padding:0 10px; margin-bottom:6px;}
  .sidebar a{display:block; padding:6px 10px; border-radius:7px; color:var(--ink-soft); text-decoration:none; font-size:13.5px;}
  .sidebar a:hover{background:var(--surface-alt); color:var(--ink);}
  .sidebar a.sub{padding-left:20px; font-size:12.8px; color:var(--ink-faint);}
  .sidebar a.sub:hover{color:var(--ink-soft);}

  main.content{flex:1; min-width:0; padding:36px 40px 100px; max-width:900px;}
  section{margin-bottom:58px; scroll-margin-top:74px;}
  section > .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--sapphire); display:block; margin-bottom:8px;}
  section > h2{font-size:1.65rem; margin-bottom:10px;}
  section > .lede{font-size:1.02rem; color:var(--ink-soft); max-width:66ch; margin-bottom:24px;}
  h3.sub-h{font-size:1.18rem; margin-top:30px; padding-top:22px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  h3.sub-h:first-of-type{border-top:none; padding-top:0; margin-top:16px;}
  h4{font-size:.98rem; margin-top:18px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:16px;}
  .card + .card{margin-top:12px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:.74rem; font-weight:600; margin:0 6px 6px 0; white-space:nowrap;}
  .pill.sapphire{background:var(--sapphire-tint); color:var(--sapphire);}
  .pill.cinnamon{background:var(--cinnamon-tint); color:var(--cinnamon);}
  .pill.tea{background:var(--tea-tint); color:var(--tea);}
  .pill.turmeric{background:var(--turmeric-tint); color:var(--turmeric);}
  .pill.terracotta{background:var(--terracotta-tint); color:var(--terracotta);}
  .dot{width:6px; height:6px; border-radius:50%; display:inline-block; background:currentColor;}

  /* status badges used next to every feature heading */
  .status{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-family:"IBM Plex Mono",monospace; font-size:.68rem; font-weight:500; letter-spacing:.04em; text-transform:uppercase; flex:none;}
  .status.live{background:var(--tea-tint); color:var(--tea);}
  .status.building{background:var(--turmeric-tint); color:var(--turmeric);}
  .status.planned{background:var(--surface-alt); color:var(--ink-faint); border:1px solid var(--border);}
  .status.verify{background:var(--terracotta-tint); color:var(--terracotta);}

  .feat-list{list-style:none; margin:0 0 14px; padding:0;}
  .feat-list li{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--border); color:var(--ink-soft);}
  .feat-list li:last-child{border-bottom:none;}
  .feat-list .status{margin-top:1px;}
  .feat-list strong{color:var(--ink); font-weight:600;}

  .quote{font-family:"Fraunces",serif; font-style:italic; font-size:1.1rem; color:var(--ink); border-left:3px solid var(--sapphire); padding:4px 0 4px 18px; margin:14px 0;}
  .codeblock{background:var(--code-bg); color:#D7E1F5; border-radius:10px; padding:14px 16px; font-family:"IBM Plex Mono",monospace; font-size:.82rem; overflow-x:auto; margin-bottom:16px; white-space:pre;}
  .callout{border-radius:12px; padding:14px 18px; margin-bottom:16px; font-size:.9rem;}
  .callout p{margin:0; color:inherit;}
  .callout p + p{margin-top:8px;}
  .callout.warn{background:var(--turmeric-tint); color:var(--turmeric);}
  .callout.info{background:var(--sapphire-tint); color:var(--sapphire);}
  .callout.good{background:var(--tea-tint); color:var(--tea);}
  .callout.verify{background:var(--terracotta-tint); color:var(--terracotta);}

  .legend-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}

  /* ---- product-guide components (DOCS-HELP-1) ---- */
  .doc-meta{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .doc-section{scroll-margin-top:74px;}
  .doc-section > h3{font-size:1.1rem; margin-top:26px; padding-top:20px; border-top:1px solid var(--border);}
  .doc-section:first-of-type > h3{border-top:none; padding-top:0; margin-top:14px;}

  .flow{display:flex; flex-wrap:wrap; align-items:center; gap:0; margin-bottom:16px;}
  .flow .flow-step{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 14px; font-size:.85rem; font-weight:600; color:var(--ink); box-shadow:var(--shadow);}
  .flow .flow-arrow{color:var(--ink-faint); padding:0 10px; font-size:1rem;}
  .flow .flow-branch{width:100%; padding:6px 0 6px 8px; font-size:.82rem; color:var(--ink-soft); font-family:"IBM Plex Mono",monospace;}

  .cfg-badges{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
  .cfg-badge{display:flex; flex-direction:column; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 13px; min-width:130px; box-shadow:var(--shadow);}
  .cfg-badge .cfg-label{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase;}
  .cfg-badge .cfg-items{font-size:.86rem; color:var(--ink); font-weight:600;}
  .cfg-badge.required .cfg-label{color:var(--terracotta);}
  .cfg-badge.conditional .cfg-label{color:var(--turmeric);}
  .cfg-badge.optional .cfg-label{color:var(--ink-faint);}
  .cfg-badge.unknown .cfg-label{color:var(--sapphire);}

  details.tech-ref{background:var(--code-bg); border-radius:10px; margin-bottom:16px;}
  details.tech-ref summary{cursor:pointer; padding:12px 16px; color:#D7E1F5; font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; list-style:none;}
  details.tech-ref summary::-webkit-details-marker{display:none;}
  details.tech-ref summary::before{content:"▸ "; }
  details.tech-ref[open] summary::before{content:"▾ "; }
  details.tech-ref .tech-ref-body{padding:0 16px 16px; color:#D7E1F5; font-family:"IBM Plex Mono",monospace; font-size:.8rem;}
  details.tech-ref .tech-ref-body p{color:#B9C6E4;}
  details.tech-ref .tech-ref-body a{color:#9FC1F0;}
  details.tech-ref .tech-ref-body table{color:#D7E1F5;}
  details.tech-ref .tech-ref-body th,details.tech-ref .tech-ref-body td{border-color:#2A3142;}

  footer{padding:30px 40px 60px; color:var(--ink-faint); font-size:.8rem; border-top:1px solid var(--border); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  @media (max-width:640px){
    .topbar .tag{display:none;}
    .search-box input{width:130px;}
  }
  @media (max-width:900px){
    .menu-btn{display:inline-block;}
    .mode-tabs{order:3; width:100%; margin-left:0;}
    .sidebar{position:fixed; top:53px; left:0; bottom:0; z-index:30; background:var(--bg); transform:translateX(-102%); transition:transform .18s ease; width:80vw; max-width:320px; box-shadow:var(--shadow);}
    .sidebar.open{transform:translateX(0);}
    main.content{padding:26px 20px 80px;}
  }

  /* mode filtering — only affects .doc-section blocks emitted from docs/product/*.md;
     legacy Release Log content (no data-modes attribute) is always shown */
  body[data-mode="product"] .doc-section:not([data-modes~="product"]){display:none;}
  body[data-mode="implementation"] .doc-section:not([data-modes~="implementation"]){display:none;}
  body[data-mode="technical"] .doc-section:not([data-modes~="technical"]){display:none;}
</style>
</head>
<body data-mode="all">

<div class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">☰ Menu</button>
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="32,5 55,23 45,50 32,60 19,50 9,23" fill="var(--sapphire)"/>
      <polygon points="32,5 55,23 9,23" fill="#ffffff" opacity="0.28"/>
    </svg>
    Ceylon Stack
  </div>
  <span class="tag">PRODUCT DOCUMENTATION</span>
  <div class="mode-tabs" id="modeTabs">
    <button class="mode-tab active" data-mode="all">All</button>
    <button class="mode-tab" data-mode="product">Product Guide</button>
    <button class="mode-tab" data-mode="implementation">Implementation</button>
    <button class="mode-tab" data-mode="technical">Technical</button>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search docs..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="shell">
  <nav class="sidebar" id="sidebar">
<!--SIDEBAR-->
  </nav>

  <main class="content">
<!--MAIN-->
  </main>
</div>

<footer>
  <span>Ceylon Stack — Product Documentation</span>
  <span>Private build reference, prepared ahead of public domain publish · Last updated <!--LAST_UPDATED--></span>
</footer>

<script>
window.CEYLON_SEARCH_INDEX = <!--SEARCH_INDEX_JSON-->;
(function(){
  var btn = document.getElementById('menuBtn');
  var sidebar = document.getElementById('sidebar');
  if(btn && sidebar){
    btn.addEventListener('click', function(){ sidebar.classList.toggle('open'); });
    sidebar.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){ sidebar.classList.remove('open'); });
    });
  }

  var tabs = document.querySelectorAll('.mode-tab');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      document.body.setAttribute('data-mode', tab.getAttribute('data-mode'));
    });
  });

  var input = document.getElementById('searchInput');
  var results = document.getElementById('searchResults');
  if(input && results){
    function escapeHtml(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }
    function render(items){
      if(!items.length){ results.innerHTML = '<div class="search-empty">No matches.</div>'; return; }
      results.innerHTML = items.slice(0, 20).map(function(it){
        var href = String(it.href || '').replace(/[^#a-zA-Z0-9_-]/g, '');
        var meta = escapeHtml(it.module) + (it.section ? ' — ' + escapeHtml(it.section) : '');
        return '<a href="' + href + '"><b>' + escapeHtml(it.title) + '</b><small>' + meta + '</small></a>';
      }).join('');
    }
    input.addEventListener('input', function(){
      var q = input.value.trim().toLowerCase();
      if(!q){ results.classList.remove('open'); return; }
      var items = (window.CEYLON_SEARCH_INDEX || []).filter(function(it){
        return it.text.indexOf(q) !== -1;
      });
      render(items);
      results.classList.add('open');
    });
    input.addEventListener('focus', function(){ if(input.value.trim()) results.classList.add('open'); });
    document.addEventListener('click', function(e){
      if(!results.contains(e.target) && e.target !== input){ results.classList.remove('open'); }
    });
  }
})();
</script>

</body>
</html>
