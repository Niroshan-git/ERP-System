<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>CeylonStack · Sales Navigation</title><style>body{margin:0}</style></head><body>
<!--
CEYLONSTACK GROUPED SIDEBAR — single-file, offline HTML/CSS/JavaScript.
1. Copy the root #cs-navigation-styles, its scoped style, and script into your app.
2. Edit `groups` and `routes` in the script. Proposed items are placeholders; remove or connect them when supported.
3. Replace the main .cs-content area and renderContent() with your routed content.
4. SPA integration (register after this file's script):
   document.getElementById('cs-navigation-styles').addEventListener('ceylon:navigate', event => {
     event.preventDefault(); // stops the demo hash navigation
     yourRouter.navigate(event.detail.route);
   });
   On router changes: window.CeylonSidebar.setActive(currentRoute);
5. CeylonSidebar.setCollapsed(true/false) controls the rail. Expanded groups and width are saved in localStorage.
6. For multiple instances, give each instance unique DOM IDs and a separate persistence key.
The file includes the approved brand mark and a subset of Lucide icons. No network calls, framework, iframe or font download.

<div id="cs-navigation-styles">
<style>
#cs-navigation-styles{color-scheme:light dark;--cs-surface:light-dark(#ffffff,#101820);--cs-side:light-dark(#f4f7fb,#131e2b);--cs-page:light-dark(#eef3f9,#0c141f);--cs-text:light-dark(#18304c,#e6eef8);--cs-muted:light-dark(#526983,#a0b3c9);--cs-border:light-dark(#d7e1ed,#28384b);--cs-hover:light-dark(#e5edf7,#1d2d41);--cs-active:light-dark(#d6e8fd,#183959);--cs-blue:light-dark(#21407a,#a3d0ff);--cs-cyan:light-dark(#006ca8,#55c8ed);font-family:Inter,system-ui,sans-serif;color:var(--cs-text)}
#cs-navigation-styles *{box-sizing:border-box}
#cs-navigation-styles button{font:inherit;color:inherit;cursor:pointer}
#cs-navigation-styles .cs-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
#cs-navigation-styles .cs-option{padding:10px 14px;border:1px solid var(--cs-border);background:var(--cs-surface);border-radius:8px}
#cs-navigation-styles .cs-option[aria-pressed=true]{background:var(--cs-active);color:var(--cs-blue);border-color:var(--cs-blue)}
#cs-navigation-styles .cs-window{background:var(--cs-surface);border:1px solid var(--cs-border);border-radius:14px;position:relative;overflow:clip}
#cs-navigation-styles .cs-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--cs-border)}
#cs-navigation-styles .cs-brand{display:flex;align-items:center;gap:10px;font-weight:500;flex:1}
#cs-navigation-styles .cs-brand img{width:30px;height:30px}
#cs-navigation-styles .cs-module{color:var(--cs-muted);display:flex;align-items:center;gap:8px}
#cs-navigation-styles .cs-topnav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--cs-border)}
#cs-navigation-styles .cs-topnav[hidden]{display:none}
#cs-navigation-styles .cs-topbutton{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:7px;padding:9px 10px;color:var(--cs-muted)}
#cs-navigation-styles .cs-topbutton.is-active{background:var(--cs-active);color:var(--cs-blue)}
#cs-navigation-styles .cs-body{display:grid;grid-template-columns:286px minmax(0,1fr);min-height:580px;transition:grid-template-columns .18s ease}
#cs-navigation-styles .is-collapsed .cs-body{grid-template-columns:64px minmax(0,1fr)}
#cs-navigation-styles .cs-sidebar{background:var(--cs-side);border-right:1px solid var(--cs-border);min-width:0}
#cs-navigation-styles .cs-sidehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px}
#cs-navigation-styles .cs-sidehead-label{font-weight:500;color:var(--cs-muted);padding-left:8px}
#cs-navigation-styles .cs-toggle{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;background:var(--cs-surface);border:1px solid var(--cs-border);border-radius:8px}
#cs-navigation-styles .cs-toggle .cs-open{display:none}
#cs-navigation-styles .is-collapsed .cs-toggle .cs-open{display:block}
#cs-navigation-styles .is-collapsed .cs-toggle .cs-close{display:none}
#cs-navigation-styles .is-collapsed .cs-sidehead-label{display:none}
#cs-navigation-styles .is-collapsed .cs-sidehead{padding:12px 14px}
#cs-navigation-styles .cs-navigation{padding:0 10px 14px}
#cs-navigation-styles .cs-groupbutton,#cs-navigation-styles .cs-pagebutton{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:0;border-radius:8px;background:transparent;padding:11px 10px;margin:3px 0;min-height:42px;color:var(--cs-muted)}
#cs-navigation-styles .cs-groupbutton:hover,#cs-navigation-styles .cs-pagebutton:hover,#cs-navigation-styles .cs-hublink:hover{background:var(--cs-hover);color:var(--cs-text)}
#cs-navigation-styles .cs-groupbutton.is-active{color:var(--cs-blue);background:var(--cs-active)}
#cs-navigation-styles .cs-pagebutton[aria-current=page]{background:var(--cs-active);color:var(--cs-blue);box-shadow:inset 3px 0 var(--cs-cyan);font-weight:500}
#cs-navigation-styles .cs-label{flex:1;min-width:0}
#cs-navigation-styles .cs-chevron{margin-left:auto}
#cs-navigation-styles .cs-childlinks{border-left:1px solid var(--cs-border);padding-left:8px;margin:0 0 10px 18px}
#cs-navigation-styles .cs-badge{border:1px solid var(--cs-border);border-radius:4px;padding:1px 4px;font-size:11px;color:var(--cs-muted)}
#cs-navigation-styles .is-collapsed .cs-navigation{padding:0 9px 14px}
#cs-navigation-styles .is-collapsed .cs-groupbutton{justify-content:center;padding:11px 0}
#cs-navigation-styles .is-collapsed .cs-groupbutton .cs-label,#cs-navigation-styles .is-collapsed .cs-groupbutton .cs-chevron{display:none}
#cs-navigation-styles .cs-split{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px}
#cs-navigation-styles .cs-rail .cs-groupbutton{padding:11px 0;justify-content:center}
#cs-navigation-styles .cs-secondary{border-left:1px solid var(--cs-border);padding-left:10px;min-width:0}
#cs-navigation-styles .cs-secondary-label{color:var(--cs-muted);padding:10px 8px;font-weight:500}
#cs-navigation-styles .cs-flyout{position:absolute;left:64px;top:126px;width:270px;max-width:calc(100% - 72px);z-index:5;background:var(--cs-surface);border:1px solid var(--cs-border);box-shadow:0 14px 36px light-dark(#18304c25,#00000055);border-radius:10px;padding:12px}
#cs-navigation-styles .cs-flyout[hidden]{display:none}
#cs-navigation-styles .cs-flyhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500;padding:2px 4px 8px}
#cs-navigation-styles .cs-flyclose{display:grid;place-items:center;border:0;background:var(--cs-hover);border-radius:6px;width:32px;height:32px}
#cs-navigation-styles .cs-content{padding:26px;min-width:0;background:var(--cs-page)}
#cs-navigation-styles .cs-breadcrumb{color:var(--cs-muted);margin-bottom:14px;overflow-wrap:anywhere}
#cs-navigation-styles .cs-content h2{font-size:24px;line-height:1.3;font-weight:500;margin:0 0 24px;overflow-wrap:anywhere}
#cs-navigation-styles .cs-hub{background:var(--cs-surface);border:1px solid var(--cs-border);border-radius:12px;padding:10px}
#cs-navigation-styles .cs-hubheading{padding:12px;color:var(--cs-muted)}
#cs-navigation-styles .cs-hublink{display:flex;align-items:center;gap:12px;border:0;background:transparent;width:100%;text-align:left;padding:14px 12px;border-radius:8px}
#cs-navigation-styles .cs-route{margin-top:24px;color:var(--cs-muted)}
#cs-navigation-styles svg{width:18px;height:18px;flex-shrink:0;stroke-width:1.7}
@media(max-width:620px){#cs-navigation-styles .cs-body{grid-template-columns:minmax(0,1fr);min-height:0}#cs-navigation-styles .cs-sidebar{border-right:0;border-bottom:1px solid var(--cs-border)}#cs-navigation-styles .is-collapsed .cs-body{grid-template-columns:64px minmax(0,1fr);min-height:530px}#cs-navigation-styles .cs-content{padding:20px 14px}#cs-navigation-styles .cs-module{display:none}#cs-navigation-styles .cs-hublink{padding:12px 6px;gap:8px}}
@media(prefers-reduced-motion:reduce){#cs-navigation-styles .cs-body{transition:none}}
@media(pointer:coarse){#cs-navigation-styles .cs-groupbutton,#cs-navigation-styles .cs-pagebutton,#cs-navigation-styles .cs-topbutton,#cs-navigation-styles .cs-toggle,#cs-navigation-styles .cs-flyclose{min-height:44px}}

/* Standalone app layout; all component selectors remain scoped. */
#cs-navigation-styles{font-size:14px;line-height:1.45;min-height:100vh}
#cs-navigation-styles .cs-window{border:0;border-radius:0;min-height:100vh;overflow:visible}
#cs-navigation-styles .cs-body{min-height:calc(100vh - 63px)}
#cs-navigation-styles a{text-decoration:none;color:inherit;cursor:pointer}
#cs-navigation-styles .cs-childlinks[hidden]{display:none}
#cs-navigation-styles .cs-header{min-height:63px}
#cs-navigation-styles .cs-flyout{position:fixed;top:110px;left:64px;max-height:calc(100vh - 126px);overflow-y:auto}
@media(max-width:620px){#cs-navigation-styles .cs-body{min-height:0}#cs-navigation-styles .is-collapsed .cs-body{min-height:calc(100vh - 63px)}}
</style>

const root=document.getElementById('cs-navigation-styles');
const groups=[

 {id:'cycle',name:'Sales cycle',icon:'workflow',items:[['Quotations','file-pen-line'],['Sales Orders','clipboard-list'],['Delivery Notes','truck',true],['Sales Invoices','receipt-text'],['Customer Payments','wallet',true]]},

})}

function renderContent(){const g=groups.find(x=>x.id===section),item=g.items.find(x=>x[0]===selected);root.querySelector('#cs-nav-breadcrumb').textContent='Sales / '+g.name;root.querySelector('#cs-nav-heading').textContent=selected;root.querySelector('#cs-nav-status').textContent=routes[selected]+(item?.[2]?' · Proposed destination':'');root.querySelector('#cs-hub-heading').textContent='Sales navigation';root.querySelector('#cs-hub-links').replaceChildren(...(g.id==='dashboard'?groups.filter(x=>['cycle','customers','items','reports'].includes(x.id)).map(x=>pageButton(x,x.items[0],true)):g.items.map(x=>pageButton(g,x,true))))}
function choose(g,item,user=false){section=g.id;selected=item[0];expanded.add(g.id);persist();closeFly();renderNav();renderContent();

function setActive(route){for(const g of groups){const item=g.items.find(x=>routes[x[0]]===route);if(item){choose(g,item);return true}}return false}

root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!fly.hidden){e.preventDefault();closeFly(true)}});
root.addEventListener('focusout',()=>queueMicrotask(()=>{if(!fly.hidden&&!fly.contains(document.activeElement)&&!nav.contains(document.activeElement))closeFly()}));

// Public API for SPA integration. Example: CeylonSidebar.setActive('/sales/orders').
window.CeylonSidebar={setActive,setCollapsed,getState:()=>({collapsed,selected,route:routes[selected],expanded:[...expanded]})};
root.querySelectorAll('[data-lucide]').forEach(i=>{const svg=icon(i.dataset.lucide);if(i.className)svg.setAttribute('class',i.className);i.replaceWith(svg)});
setCollapsed(collapsed);if(!setActive(location.hash.slice(1)))renderContent();
})();
